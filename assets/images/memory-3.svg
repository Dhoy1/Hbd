<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CDB4DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5E456F;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg3)"/>
  <!-- Stars background -->
  <circle cx="320" cy="280" r="90" fill="rgba(255,255,255,0.08)"/>
  <circle cx="70" cy="60" r="60" fill="rgba(255,255,255,0.08)"/>
  <text x="40" y="50" font-size="10" fill="rgba(255,255,255,0.6)">✦</text>
  <text x="80" y="100" font-size="8" fill="rgba(255,255,255,0.4)">✦</text>
  <text x="310" y="40" font-size="12" fill="rgba(255,255,255,0.6)">✦</text>
  <text x="350" y="120" font-size="8" fill="rgba(255,255,255,0.4)">✦</text>
  <text x="20" y="200" font-size="10" fill="rgba(255,255,255,0.5)">✦</text>
  <text x="380" y="250" font-size="8" fill="rgba(255,255,255,0.4)">✦</text>
  <text x="150" y="300" font-size="10" fill="rgba(255,255,255,0.5)">✦</text>
  <text x="250" y="290" font-size="8" fill="rgba(255,255,255,0.4)">✦</text>
  <!-- Moon -->
  <circle cx="310" cy="70" r="35" fill="rgba(255,255,255,0.25)"/>
  <circle cx="325" cy="60" r="30" fill="url(#bg3)"/>
  <!-- Main illustration: lantern / hot air balloon style -->
  <g transform="translate(130, 60)">
    <!-- Balloon -->
    <ellipse cx="70" cy="70" rx="55" ry="65" fill="rgba(255,255,255,0.25)"/>
    <!-- Stripes -->
    <ellipse cx="70" cy="70" rx="20" ry="65" fill="rgba(255,255,255,0.1)"/>
    <ellipse cx="70" cy="70" rx="40" ry="65" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <ellipse cx="70" cy="70" rx="55" ry="65" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
    <!-- Highlight -->
    <ellipse cx="50" cy="45" rx="18" ry="25" fill="rgba(255,255,255,0.15)"/>
    <!-- Basket ropes -->
    <line x1="45" y1="133" x2="55" y2="155" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <line x1="95" y1="133" x2="85" y2="155" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <!-- Basket -->
    <rect x="48" y="155" width="44" height="28" rx="6" fill="rgba(255,255,255,0.3)"/>
    <!-- Star inside basket area -->
    <text x="62" y="174" font-size="16" fill="rgba(255,255,255,0.8)">★</text>
  </g>
  <!-- Floating hearts -->
  <text x="60" y="180" font-size="16" fill="rgba(248,200,220,0.7)">♡</text>
  <text x="330" y="200" font-size="14" fill="rgba(248,200,220,0.6)">♡</text>
  <text x="100" y="270" font-size="18" fill="rgba(248,200,220,0.5)">♡</text>
  <text x="200" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="rgba(255,255,255,0.8)" font-style="italic">Memory Three</text>
  <text x="200" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(255,255,255,0.6)">✦ Ganti dengan foto asli ✦</text>
</svg>
