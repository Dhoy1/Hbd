<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF1E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EFA6B5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg2)"/>
  <circle cx="350" cy="50" r="70" fill="rgba(255,255,255,0.2)"/>
  <circle cx="50" cy="300" r="80" fill="rgba(255,255,255,0.15)"/>
  <!-- Stars -->
  <text x="30" y="60" font-size="20" fill="rgba(255,255,255,0.7)">★</text>
  <text x="360" y="200" font-size="16" fill="rgba(255,255,255,0.6)">★</text>
  <text x="190" y="30" font-size="12" fill="rgba(255,255,255,0.5)">★</text>
  <!-- Main illustration: flowers -->
  <g transform="translate(135, 70)">
    <!-- Flower 1 -->
    <g transform="translate(30,40)">
      <circle cx="0" cy="-18" r="12" fill="rgba(255,255,255,0.6)"/>
      <circle cx="12" cy="-9" r="12" fill="rgba(255,255,255,0.6)"/>
      <circle cx="12" cy="9" r="12" fill="rgba(255,255,255,0.6)"/>
      <circle cx="0" cy="18" r="12" fill="rgba(255,255,255,0.6)"/>
      <circle cx="-12" cy="9" r="12" fill="rgba(255,255,255,0.6)"/>
      <circle cx="-12" cy="-9" r="12" fill="rgba(255,255,255,0.6)"/>
      <circle cx="0" cy="0" r="14" fill="rgba(239,166,181,0.8)"/>
    </g>
    <!-- Flower 2 -->
    <g transform="translate(90,30)">
      <circle cx="0" cy="-14" r="10" fill="rgba(255,255,255,0.5)"/>
      <circle cx="10" cy="-7" r="10" fill="rgba(255,255,255,0.5)"/>
      <circle cx="10" cy="7" r="10" fill="rgba(255,255,255,0.5)"/>
      <circle cx="0" cy="14" r="10" fill="rgba(255,255,255,0.5)"/>
      <circle cx="-10" cy="7" r="10" fill="rgba(255,255,255,0.5)"/>
      <circle cx="-10" cy="-7" r="10" fill="rgba(255,255,255,0.5)"/>
      <circle cx="0" cy="0" r="12" fill="rgba(205,180,219,0.9)"/>
    </g>
    <!-- Stem lines -->
    <line x1="30" y1="65" x2="30" y2="110" stroke="rgba(94,69,111,0.5)" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="55" x2="90" y2="110" stroke="rgba(94,69,111,0.5)" stroke-width="3" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="20" cy="88" rx="12" ry="6" fill="rgba(94,69,111,0.3)" transform="rotate(-30 20 88)"/>
    <ellipse cx="100" cy="80" rx="12" ry="6" fill="rgba(94,69,111,0.3)" transform="rotate(30 100 80)"/>
  </g>
  <!-- Hearts -->
  <text x="60" y="150" font-size="18" fill="rgba(255,255,255,0.7)">♡</text>
  <text x="320" y="120" font-size="14" fill="rgba(255,255,255,0.6)">♡</text>
  <text x="270" y="280" font-size="20" fill="rgba(255,255,255,0.6)">♡</text>
  <text x="200" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="rgba(94,69,111,0.8)" font-style="italic">Memory Two</text>
  <text x="200" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(94,69,111,0.6)">✦ Ganti dengan foto asli ✦</text>
</svg>
