<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8C8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CDB4DB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="320" rx="20" fill="url(#bg1)"/>
  <!-- Decorative circles -->
  <circle cx="320" cy="60" r="80" fill="rgba(255,255,255,0.15)"/>
  <circle cx="60" cy="270" r="60" fill="rgba(255,255,255,0.1)"/>
  <!-- Stars -->
  <text x="50" y="80" font-size="24" fill="rgba(255,255,255,0.7)">✦</text>
  <text x="330" y="180" font-size="18" fill="rgba(255,255,255,0.6)">✦</text>
  <text x="180" y="40" font-size="14" fill="rgba(255,255,255,0.5)">✦</text>
  <text x="360" y="290" font-size="20" fill="rgba(255,255,255,0.5)">✦</text>
  <!-- Main illustration: camera -->
  <g transform="translate(140, 90)">
    <!-- Camera body -->
    <rect x="0" y="20" width="120" height="90" rx="12" fill="rgba(255,255,255,0.5)"/>
    <rect x="10" y="10" width="40" height="20" rx="6" fill="rgba(255,255,255,0.6)"/>
    <!-- Lens -->
    <circle cx="60" cy="65" r="28" fill="rgba(95,70,110,0.3)"/>
    <circle cx="60" cy="65" r="20" fill="rgba(95,70,110,0.4)"/>
    <circle cx="60" cy="65" r="12" fill="rgba(95,70,110,0.5)"/>
    <!-- Shine -->
    <circle cx="52" cy="57" r="4" fill="rgba(255,255,255,0.6)"/>
    <!-- Flash -->
    <rect x="90" y="28" width="18" height="12" rx="4" fill="rgba(255,255,255,0.7)"/>
  </g>
  <!-- Hearts -->
  <text x="30" y="140" font-size="20" fill="rgba(239,166,181,0.8)">♡</text>
  <text x="340" y="100" font-size="16" fill="rgba(239,166,181,0.7)">♡</text>
  <text x="290" y="270" font-size="22" fill="rgba(239,166,181,0.6)">♡</text>
  <!-- Text label -->
  <text x="200" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="rgba(94,69,111,0.8)" font-style="italic">Memory One</text>
  <text x="200" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="rgba(94,69,111,0.6)">✦ Ganti dengan foto asli ✦</text>
</svg>
